name: Release

# Sur main : calcule la version (semver, d'après les messages de commit), construit l'image,
# la publie sur Docker Hub (X.Y.Z et latest) puis crée le tag et la fiche de version.
# Sur une branche ci/** : essai à blanc (connexion et construction, sans publication ni tag).

on:
  push:
    branches: [main, "ci/**"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: DOCKERHUB_TOKEN
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME || 'poltergeistz' }}/agence-os
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Variables de build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: |
          missing=""
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_APP_URL; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          [ -z "$missing" ] && exit 0
          if [ "$PUBLISH" = "true" ]; then
            echo "::error::Variables manquantes (Settings > Secrets and variables > Actions > Variables) :$missing"
            exit 1
          fi
          echo "::warning::Essai à blanc avec des valeurs factices, variables manquantes :$missing"

      - name: Prochaine version
        id: version
        if: env.PUBLISH == 'true'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true
          default_bump: patch
          tag_prefix: v
          release_branches: main

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'poltergeistz' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.new_version || 'essai' }}
            ${{ env.IMAGE }}:${{ env.PUBLISH == 'true' && 'latest' || 'essai' }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
            NEXT_PUBLIC_EDITION=${{ vars.NEXT_PUBLIC_EDITION }}
            NEXT_PUBLIC_SHORT_DOMAIN=${{ vars.NEXT_PUBLIC_SHORT_DOMAIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag et fiche de version
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.version.outputs.new_tag }}" --target "$GITHUB_SHA" --title "${{ steps.version.outputs.new_tag }}" --generate-notes
