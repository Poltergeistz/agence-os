name: Release

# Sur main : calcule la version (semver, d'après les messages de commit : feat = mineure, fix = correctif,
# ! ou BREAKING CHANGE = majeure), commite CHANGELOG.md et la version de package.json, pose le tag et la fiche
# de version, puis construit l'image et la publie sur Docker Hub (X.Y.Z et latest).
# Aucune version si aucun commit feat/fix depuis la précédente.
# Sur une branche ci/** : essai à blanc (connexion et construction, sans publication ni tag).

on:
  push:
    branches: [main, "ci/**"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: DOCKERHUB_TOKEN
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME || 'poltergeistz' }}/agence-os
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Variables de build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: |
          missing=""
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_APP_URL; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          [ -z "$missing" ] && exit 0
          if [ "$PUBLISH" = "true" ]; then
            echo "::error::Variables manquantes (Settings > Secrets and variables > Actions > Variables) :$missing"
            exit 1
          fi
          echo "::warning::Essai à blanc avec des valeurs factices, variables manquantes :$missing"

      - uses: actions/setup-node@v4
        if: env.PUBLISH == 'true'
        with:
          node-version: 22

      - name: Version
        id: version
        if: env.PUBLISH == 'true'
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Se placer sur la version publiée
        if: steps.version.outputs.new_release_published == 'true'
        run: |
          git fetch --tags origin
          git checkout "v${{ steps.version.outputs.new_release_version }}"

      - uses: docker/setup-buildx-action@v3
        if: env.PUBLISH != 'true' || steps.version.outputs.new_release_published == 'true'

      - uses: docker/login-action@v3
        if: env.PUBLISH != 'true' || steps.version.outputs.new_release_published == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'poltergeistz' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: env.PUBLISH != 'true' || steps.version.outputs.new_release_published == 'true'
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.new_release_version || 'essai' }}
            ${{ env.IMAGE }}:${{ env.PUBLISH == 'true' && 'latest' || 'essai' }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
            NEXT_PUBLIC_EDITION=${{ vars.NEXT_PUBLIC_EDITION }}
            NEXT_PUBLIC_SHORT_DOMAIN=${{ vars.NEXT_PUBLIC_SHORT_DOMAIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
