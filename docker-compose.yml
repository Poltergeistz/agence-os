# Déploiement Coolify (Docker Compose) ou test local : docker compose up --build
# Les variables viennent de l'environnement (onglet Environment Variables de Coolify, ou fichier .env).
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_EDITION: ${NEXT_PUBLIC_EDITION:-}
        NEXT_PUBLIC_SHORT_DOMAIN: ${NEXT_PUBLIC_SHORT_DOMAIN:-}
    restart: unless-stopped
    environment:
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SIGNATURE_SECRET: ${SIGNATURE_SECRET:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL_FAST: ${AI_MODEL_FAST:-}
      AI_MODEL_SMART: ${AI_MODEL_SMART:-}
      AI_TAG_LIMIT: ${AI_TAG_LIMIT:-}
      CRON_SECRET: ${CRON_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-}
    ports:
      - "3000:3000"
